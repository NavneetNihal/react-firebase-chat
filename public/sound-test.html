<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sound Test</title>
  <style>
    body { background: #0d1117; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; margin: 0; }
    button { padding: 14px 28px; font-size: 16px; background: #5183fe; border: none; border-radius: 8px; color: white; cursor: pointer; font-family: monospace; font-weight: bold; }
    button:hover { background: #3f6fd6; }
    #log { background: #111; border: 1px solid #333; border-radius: 6px; padding: 14px; width: 480px; min-height: 80px; font-size: 13px; white-space: pre-wrap; color: #0f0; }
    h2 { color: #5183fe; }
  </style>
</head>
<body>
  <h2>🎮 OOF Sound Test</h2>
  <button onclick="playOof()">▶ Play Gaming Oof</button>
  <button onclick="playChime()">▶ Play Chime</button>
  <button onclick="playTrombone()">▶ Play Sad Trombone</button>
  <button onclick="playBuzzer()">▶ Play Buzzer</button>
  <button onclick="playLaser()">▶ Play Laser</button>
  <pre id="log">Click a button to test...\n</pre>

  <script>
    let ctx = null;
    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
      console.log(msg);
    }

    async function getCtx() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        log('[Sound] Created new AudioContext, state: ' + ctx.state);
      }
      if (ctx.state === 'suspended') {
        await ctx.resume();
        log('[Sound] Resumed ctx, new state: ' + ctx.state);
      }
      return ctx;
    }

    async function playOof() {
      const c = await getCtx();
      const now = c.currentTime;
      log('[Oof] Playing at t=' + now.toFixed(3) + ' state=' + c.state);
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(350, now + 0.10);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.setValueAtTime(0.22, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + 0.22);
      log('[Oof] Started! Should hear it now.');
    }

    async function playChime() {
      const c = await getCtx();
      const now = c.currentTime;
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(now); osc.stop(now + 0.32);
      log('[Chime] Playing...');
    }

    async function playTrombone() {
      const c = await getCtx();
      const now = c.currentTime;
      const notes = [349.23, 329.63, 311.13, 280.00];
      notes.forEach((freq, i) => {
        const t0 = now + i * 0.22;
        const t1 = t0 + (i === 3 ? 0.55 : 0.20);
        const osc = c.createOscillator(); const gain = c.createGain(); const filter = c.createBiquadFilter();
        osc.type = 'sawtooth'; filter.type = 'lowpass'; filter.frequency.setValueAtTime(900, t0);
        osc.frequency.setValueAtTime(freq, t0); osc.frequency.linearRampToValueAtTime(freq - 12, t1);
        gain.gain.setValueAtTime(0.09, t0); gain.gain.exponentialRampToValueAtTime(0.001, t1);
        osc.connect(filter); filter.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t1 + 0.01);
      });
      log('[Trombone] Playing...');
    }

    async function playBuzzer() {
      const c = await getCtx();
      const now = c.currentTime;
      const osc1 = c.createOscillator(); const osc2 = c.createOscillator();
      const gain = c.createGain(); const filter = c.createBiquadFilter();
      osc1.type = 'sawtooth'; osc2.type = 'sawtooth'; filter.type = 'lowpass';
      osc1.frequency.setValueAtTime(130.81, now); osc2.frequency.setValueAtTime(138.59, now);
      filter.frequency.setValueAtTime(500, now); gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.40);
      osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(c.destination);
      osc1.start(now); osc2.start(now); osc1.stop(now + 0.42); osc2.stop(now + 0.42);
      log('[Buzzer] Playing...');
    }

    async function playLaser() {
      const c = await getCtx();
      const now = c.currentTime;
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.20);
      gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
      osc.connect(gain); gain.connect(c.destination); osc.start(now); osc.stop(now + 0.22);
      log('[Laser] Playing...');
    }

    log('Page loaded. Click any button to play sound.');
  </script>
</body>
</html>
